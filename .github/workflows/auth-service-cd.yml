name: auth-service CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/auth-service/**'
      - 'services/shared-observability/**'
      - 'services/*.gradle.kts'
      - '.github/workflows/auth-service-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Build auth-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    env:
      DB_URL: jdbc:postgresql://localhost:5432/no-se-usa
      DB_USERNAME: ci
      DB_PASSWORD: ci
      INTERNAL_API_KEY: dummy-internal-key-for-ci
      JWT_ALLOW_EPHEMERAL: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/**/*.gradle.kts
            services/gradle/wrapper/gradle-wrapper.properties

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x ./gradlew

      - name: Build y tests de auth-service
        run: ./gradlew :auth-service:build --configure-on-demand --no-daemon

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
    with:
      service: auth
      compose-service: auth-service
      health-url: http://127.0.0.1:8081/actuator/health
      migration-dir: services/auth-service/src/main/resources/db/migration
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
