name: Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-ci.yml'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Lint, Test & Build Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'gateway/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: gateway

      - name: Run linter
        run: pnpm lint
        working-directory: gateway

      - name: Run unit & integration tests
        run: pnpm test
        working-directory: gateway

      - name: Typecheck and compile TypeScript
        run: pnpm build
        working-directory: gateway
