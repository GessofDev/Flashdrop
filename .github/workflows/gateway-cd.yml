name: Gateway CD

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-cd.yml'
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test, Build & Deploy Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'gateway/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: gateway

      - name: Run unit & integration tests
        run: pnpm test
        working-directory: gateway

      - name: Typecheck and compile TypeScript
        run: pnpm build
        working-directory: gateway

      - name: Deploy Gateway to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            REPO_DIR="$HOME/flashdrop_backend"
            if [ ! -d "$REPO_DIR" ]; then
              if [ -d "$HOME/Flashdrop" ]; then
                REPO_DIR="$HOME/Flashdrop"
              elif [ -d "$HOME/flashdrop" ]; then
                REPO_DIR="$HOME/flashdrop"
              fi
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main
            cd gateway/docker
            docker compose -f docker-compose.stack.yml \
              --env-file .env up -d --no-deps --build gateway
            for i in {1..12}; do
              if curl -sf http://127.0.0.1:3000/health > /dev/null; then
                echo "Gateway is up and healthy!"
                exit 0
              fi
              echo "Waiting for Gateway health check... ($i/12)"
              sleep 5
            done
            echo "Gateway health check timed out"
            exit 1
