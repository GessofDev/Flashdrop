name: Web App CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-cd.yml'
  workflow_dispatch:
    inputs:
      # The environment the deploy is approved in. `dev` is the environment
      # that exists today (the VPS).
      environment:
        required: false
        type: string
        default: "dev"

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy to FloCI S3
    runs-on: ubuntu-latest
    # Approval gate: the environment must be configured with required
    # reviewers in the repository settings.
    environment: ${{ inputs.environment || 'dev' }}
    # Serialize the web deploys and never cancel a running one.
    concurrency:
      group: deploy-web
      cancel-in-progress: false

    steps:
      # The SSH host key must be pinned. Without a fingerprint the SSH step
      # accepts any host key, so a man-in-the-middle could take the deploy.
      - name: "Guard: SSH host key fingerprint configured"
        # The secrets context is not available in a step-level if expression,
        # so the secret is exposed through the step environment first.
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        if: ${{ env.VPS_SSH_FINGERPRINT == '' }}
        run: |
          echo "::error::VPS_SSH_FINGERPRINT is empty."
          echo "The SSH host key must be pinned before deploying"
          echo "(see the CD runbook). Without a fingerprint the SSH"
          echo "step accepts any host key."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'apps/web/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Run unit & component tests
        run: pnpm test
        working-directory: apps/web

      - name: Typecheck and compile production bundle
        run: pnpm build
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://76.13.168.23

      - name: Package build artifacts
        run: tar -czf dist.tar.gz -C apps/web/dist .

      - name: Copy bundle archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: 'dist.tar.gz'
          target: '~'
          overwrite: true

      - name: Unpack and sync to FloCI S3
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script: |
            set -e
            mkdir -p ~/flashdrop-dist
            tar -xzf ~/dist.tar.gz -C ~/flashdrop-dist
            export AWS_ACCESS_KEY_ID=test
            export AWS_SECRET_ACCESS_KEY=test
            export AWS_DEFAULT_REGION=us-east-1
            aws --endpoint-url http://127.0.0.1:4566 s3 sync \
              ~/flashdrop-dist s3://flashdrop-web --delete
            rm -f ~/dist.tar.gz
