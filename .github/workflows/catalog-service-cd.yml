name: Catalog Service CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/catalog-service-cd.yml'
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test, Build & Deploy catalog-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog-service
    env:
      INTERNAL_API_KEY: dev-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/catalog-service/**/*.gradle.kts
            services/catalog-service/gradle/wrapper/gradle-wrapper.properties

      - name: Allow Gradle wrapper execution
        run: chmod +x ./gradlew

      - name: Run Catalog tests
        run: ./gradlew test --no-daemon

      - name: Deploy catalog-service to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            REPO_DIR="$HOME/flashdrop_backend"
            if [ ! -d "$REPO_DIR" ]; then
              if [ -d "$HOME/Flashdrop" ]; then
                REPO_DIR="$HOME/Flashdrop"
              elif [ -d "$HOME/flashdrop" ]; then
                REPO_DIR="$HOME/flashdrop"
              fi
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main
            cd gateway/docker
            docker compose -f docker-compose.stack.yml \
              --env-file .env up -d --no-deps --build catalog-service
            for i in {1..12}; do
              if curl -sf http://127.0.0.1:8082/actuator/health \
                > /dev/null; then
                echo "catalog-service is up and healthy!"
                exit 0
              fi
              echo "Waiting for catalog-service health check... ($i/12)"
              sleep 5
            done
            echo "catalog-service health check timed out"
            exit 1
