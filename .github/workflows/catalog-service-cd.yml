name: Catalog Service CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/catalog-service-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Build catalog-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog-service
    env:
      INTERNAL_API_KEY: dev-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/catalog-service/**/*.gradle.kts
            services/catalog-service/gradle/wrapper/gradle-wrapper.properties

      - name: Allow Gradle wrapper execution
        run: chmod +x ./gradlew

      - name: Run Catalog tests
        run: ./gradlew test --no-daemon

  # The demo images used to be uploaded by the inline deploy step before the
  # service restarted, because migration V4 points to objects that must already
  # exist. That upload is now the pre-deploy step of catalog, configured in
  # gateway/docker/scripts/deploy-services.conf.
  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
    with:
      service: catalog
      compose-service: catalog-service
      health-url: http://127.0.0.1:8082/actuator/health
      migration-dir: services/catalog-service/src/main/resources/db/migration
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
