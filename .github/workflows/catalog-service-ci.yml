name: Catalog Service CI

on:
  push:
    branches: [main]
    paths:
      - "services/catalog-service/**"
      - ".github/workflows/catalog-service-ci.yml"
  pull_request:
    paths:
      - "services/catalog-service/**"
      - ".github/workflows/catalog-service-ci.yml"
  workflow_dispatch: {}

jobs:
  test:
    name: Gradle tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog-service
    env:
      INTERNAL_API_KEY: dev-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            services/catalog-service/**/*.gradle.kts
            services/catalog-service/gradle/wrapper/gradle-wrapper.properties

      - name: Allow Gradle wrapper execution
        run: chmod +x ./gradlew

      - name: Run Catalog tests
        run: ./gradlew test --no-daemon

      - name: Require PostgreSQL integration coverage
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("build/test-results/test/TEST-com.flashdrop.catalog.infrastructure.adapter.outbound.persistence.jpa.JpaProductRepositoryAdapterIT.xml")
          suite = ET.parse(report).getroot()
          if int(suite.attrib["tests"]) == 0 or any(
              int(suite.attrib.get(key, "0")) for key in ("skipped", "failures", "errors")
          ):
              raise SystemExit("PostgreSQL integration tests must execute and pass in CI")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-catalog-service
          path: services/catalog-service/build/reports/tests/test
          if-no-files-found: ignore
