name: Orders Service CD

on:
  push:
    branches:
      - main
    paths:
      - 'services/orders-service/**'
      - '.github/workflows/orders-service-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Build orders-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orders-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dar permiso de ejecucion a mvnw
        run: chmod +x mvnw

      - name: Descargar imagen de PostgreSQL (con reintentos)
        working-directory: .
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:15-alpine; then exit 0; fi
            echo "Intento $attempt fallido; reintentando en $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "No se pudo descargar postgres:15-alpine tras 5 intentos"
          exit 1

      - name: Run tests (Surefire + Failsafe)
        run: ./mvnw verify

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
    with:
      service: orders
      compose-service: orders-service
      health-url: http://127.0.0.1:8083/actuator/health
      migration-dir: services/orders-service/src/main/resources/db/migration
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
