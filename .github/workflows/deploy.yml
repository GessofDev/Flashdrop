name: Reusable Deploy

on:
  workflow_call:
    inputs:
      # Logical service id: auth | catalog | delivery | orders | gateway
      service:
        required: true
        type: string
      # docker compose service name in gateway/docker/docker-compose.stack.yml
      compose-service:
        required: true
        type: string
      # Full URL polled on the VPS after the deploy
      health-url:
        required: true
        type: string
      # Repo-relative dir with the service Flyway SQL files.
      # Empty means the service has no migrations.
      migration-dir:
        required: false
        type: string
        default: ""
      # Non-empty only for delivery, which owns the internal schema
      migration-schema:
        required: false
        type: string
        default: ""
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_SSH_FINGERPRINT:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Approval gate: the `production` environment must be configured with
    # required reviewers in the repository settings.
    environment: production
    # Serialize deploys per service and never cancel a running deploy.
    # Callers must NOT declare this group, the called job would deadlock.
    concurrency:
      group: deploy-${{ inputs.service }}
      cancel-in-progress: false
    steps:
      # The SSH host key must be pinned. Without a fingerprint the SSH step
      # accepts any host key, so a man-in-the-middle could take the deploy.
      - name: "Guard: SSH host key fingerprint configured"
        # The secrets context is not available in a step-level if expression,
        # so the secret is exposed through the step environment first.
        env:
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        if: ${{ env.VPS_SSH_FINGERPRINT == '' }}
        run: |
          echo "::error::VPS_SSH_FINGERPRINT is empty."
          echo "The SSH host key must be pinned before deploying"
          echo "(see the CD runbook). Without a fingerprint the SSH"
          echo "step accepts any host key."
          exit 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          port: 22
          script: |
            set -euo pipefail
            REPO_DIR="$HOME/flashdrop_backend"
            if [ ! -d "$REPO_DIR" ]; then
              if [ -d "$HOME/Flashdrop" ]; then
                REPO_DIR="$HOME/Flashdrop"
              elif [ -d "$HOME/flashdrop" ]; then
                REPO_DIR="$HOME/flashdrop"
              fi
            fi
            cd "$REPO_DIR"
            # Deploy the exact SHA that was tested, never whatever
            # origin/main points at.
            SHA="${{ github.sha }}"
            # The version that is running right now. It is the fallback for
            # the first deploy, before the script has a state file.
            PREVIOUS_SHA="$(git rev-parse HEAD)"
            git fetch --no-tags origin "$SHA" || git fetch --no-tags origin
            if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
              echo "::error::commit ${SHA} is unknown on the server"
              exit 1
            fi
            # --force replaces the tracked files with the deployed commit
            # and keeps the untracked (gitignored) .env on the server.
            git checkout --force --detach "$SHA"
            # The server-side script owns the deploy, the migrations and the
            # rollback. It exits non-zero when the deploy fails, after
            # attempting its own rollback.
            bash gateway/docker/scripts/deploy-service.sh \
              --service "${{ inputs.service }}" \
              --compose-service "${{ inputs.compose-service }}" \
              --health-url "${{ inputs.health-url }}" \
              --sha "$SHA" \
              --previous-sha "$PREVIOUS_SHA" \
              --migration-dir "${{ inputs.migration-dir }}" \
              --migration-schema "${{ inputs.migration-schema }}"

      - name: Deploy result
        env:
          SERVICE: ${{ inputs.service }}
          SHA: ${{ github.sha }}
        run: |
          echo "Service: $SERVICE"
          echo "Deployed SHA: $SHA"
