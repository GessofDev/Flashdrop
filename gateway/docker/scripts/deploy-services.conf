# Per-service deploy configuration.
#
# One row per service, pipe separated:
#
#   id | compose service | container | migration owner | db kind |
#   db user env | db password env | migration dir (repo relative) | flyway schema |
#   pre-deploy command
#
# The pre-deploy command runs from the repository root, after the migrations and
# before the container is started. Catalog uses it to upload the demo images
# its migration points to.
#
# migration owner:
#   app  the application applies its own migrations when it starts (Flyway is
#        enabled in the service). The deploy only verifies them afterwards.
#   cd   the application runs with Flyway disabled, so the deploy applies the
#        migrations before the new version starts.
#
# db kind:
#   jdbc  the service gets a full JDBC URL in DB_URL.
#   parts the service gets the database coordinates in separate variables.

auth|auth-service|stack-auth|app|jdbc|DB_USERNAME|DB_PASSWORD|services/auth-service/src/main/resources/db/migration|public|
catalog|catalog-service|stack-catalog|app|jdbc|DB_USERNAME|DB_PASSWORD|services/catalog-service/src/main/resources/db/migration|public|bash infra/demo-images/upload.sh
delivery|delivery-service|stack-delivery|app|parts|DELIVERY_DB_USER|DELIVERY_DB_PASSWORD|services/delivery-service/src/main/resources/db/migration|internal|
orders|orders-service|stack-orders|cd|jdbc|DB_USERNAME|DB_PASSWORD|services/orders-service/src/main/resources/db/migration|public|
