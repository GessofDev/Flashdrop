server:
  port: 3000
  host: 0.0.0.0

redis:
  url: redis://redis-cache:6379
  onFailure: open

logging:
  level: info

metrics:
  enabled: true
  path: /metrics

# Health aggregation: el gateway consulta <target>/actuator/health en paralelo
# para cada ruta. auth, catalog, orders y delivery exponen /actuator/health
# vía Spring Boot Actuator.
health:
  enabled: true
  path: /health
  backendPath: /actuator/health
  timeoutMs: 2000

# Los orígenes se entregan como lista YAML/JSON en CORS_ORIGINS.
cors:
  enabled: true
  origins: ${CORS_ORIGINS}
  methods: [GET, POST, PUT, DELETE, OPTIONS]
  allowedHeaders: [Content-Type, Authorization, X-My-Store-Restaurant]
  maxAge: 86400

jwt:
  enabled: true
  mode: jwks
  issuers:
    - name: flashdrop-auth
      jwksUri: ${AUTH_SERVICE_JWKS_URI}
      issuer: flashdrop-auth

# Los flujos que emiten o renuevan credenciales siguen siendo públicos.
jwtOverrides:
  - path: /auth/register
    jwt: { enabled: false, mode: jwks, issuer: flashdrop-auth }
  - path: /auth/login
    jwt: { enabled: false, mode: jwks, issuer: flashdrop-auth }
  - path: /auth/refresh
    jwt: { enabled: false, mode: jwks, issuer: flashdrop-auth }
  - path: /auth/logout
    jwt: { enabled: false, mode: jwks, issuer: flashdrop-auth }
  - path: /auth/password/forgot
    jwt: { enabled: false, mode: jwks, issuer: flashdrop-auth }
  - path: /auth/password/reset
    jwt: { enabled: false, mode: jwks, issuer: flashdrop-auth }
  - path: /auth/email/confirm
    jwt: { enabled: false, mode: jwks, issuer: flashdrop-auth }
  - path: /auth/.well-known/jwks.json
    jwt: { enabled: false, mode: jwks, issuer: flashdrop-auth }
routes:
  # === AUTH ===
  - prefix: /auth
    target: http://auth-service:8081
    stripPrefix: false
    backendName: auth-service

  # === CATALOG ===
  - prefix: /catalog
    target: http://catalog-service:8082
    stripPrefix: false
    backendName: catalog-service
    # El catalogo es navegable sin sesion; sus operaciones internas/mutables
    # mantienen la defensa X-Internal-Api-Key en el propio servicio.
    jwt: { enabled: false, mode: jwks, issuer: flashdrop-auth }

  - prefix: /api/catalog
    target: http://catalog-service:8082
    stripPrefix: false
    backendName: catalog-service

  # === ORDERS (3 prefijos distintos, mismo target) ===
  - prefix: /api/orders
    target: http://orders-service:8083
    stripPrefix: false
    backendName: orders-service

  # === PAGOS (pasarela simulada F8) ===
  # Prefijo acotado: solo la pantalla de pago simulada
  # (POST /api/payments/fake/{providerTxId}/resolve).
  # /api/payments/webhook no pasa por el gateway: lo consume la pasarela
  # directo contra orders-service y se autentica con la firma del aviso,
  # sin JWT.
  # El prefijo NO se quita (stripPrefix: false) porque orders-service
  # mapea /api/payments/fake/**. La autenticacion la exige orders-service
  # (/api/payments/** -> authenticated) y el control de ownership del
  # controller.
  - prefix: /api/payments/fake
    target: http://orders-service:8083
    stripPrefix: false
    backendName: orders-service

  - prefix: /api/delivery
    target: http://delivery-service:8084
    stripPrefix: false
    backendName: delivery-service

  # === DELIVERY ===
  - prefix: /delivery
    target: http://delivery-service:8084
    stripPrefix: false
    backendName: delivery-service

  # === REVIEWS ===
  - prefix: /api/reviews
    target: http://reviews-service:8085
    stripPrefix: false
    backendName: reviews-service

  - prefix: /api/users/me/reviews
    target: http://reviews-service:8085
    stripPrefix: false
    backendName: reviews-service

overrides:
  - path: /api/reviews
    rateLimit:
      maxRequests: 10
      windowSeconds: 60
  - path: /api/delivery/location
    rateLimit:
      maxRequests: 30
      windowSeconds: 60
