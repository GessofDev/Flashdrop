# =============================================================================
# FlashDrop — stack completo sobre Floci
# =============================================================================
#   docker compose -f gateway/docker/docker-compose.stack.yml up -d --build
#
# Requiere un `.env` junto a este archivo. Copiar `env.stack.template` y
# completarlo; ese `.env` esta en .gitignore y no se commitea nunca.
#
# Las variables escritas como ${VAR:?...} no tienen valor por defecto a
# proposito: si falta una, compose se niega a arrancar y dice cual. Es
# preferible a levantar cinco servicios apuntando a cualquier cosa.
# =============================================================================

name: flashdrop

networks:
  # Red propia del stack: es la que da el DNS interno, por eso los servicios se
  # llaman entre ellos por nombre (`http://auth-service:8081`).
  stack:
    driver: bridge

  # Red de Floci, donde viven las cuatro instancias RDS. Los servicios llegan a
  # sus bases por 172.16.1.2, que es el contenedor de Floci haciendo de proxy,
  # y esa direccion NO es alcanzable desde la red `stack`: son dos bridges
  # distintos. Por eso cada servicio esta en las dos redes.
  #
  # `external: true` es obligatorio: la red ya existe y el resumen tecnico del
  # servidor dice explicitamente que no se borra ni se recrea. Unirse a ella no
  # la modifica.
  floci_default:
    external: true

volumes:
  redis-data:

services:

  # ===========================================================================
  # redis — lo necesita el gateway para rate limiting
  # ===========================================================================
  redis-cache:
    image: redis:7-alpine
    container_name: stack-redis
    networks: [stack]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # auth-service — :8081 — base flashdrop_auth (Floci 7004)
  # Contexto services/: depende del modulo hermano shared-observability.
  # ===========================================================================
  auth-service:
    build:
      context: ../../services
      dockerfile: auth-service/Dockerfile
    container_name: stack-auth
    networks: [stack, floci_default]
    environment:
      - PORT=8081
      - DB_URL=jdbc:postgresql://172.16.1.2:7004/flashdrop_auth
      - DB_USERNAME=auth_app
      - DB_PASSWORD=${AUTH_DB_PASSWORD:?falta AUTH_DB_PASSWORD en .env}
      # El seed vive fuera de db/migration. Esta base de desarrollo ya tiene la
      # V2 aplicada, asi que necesita la variable aunque no quiera recargar
      # nada: sin ella Flyway falla al no encontrar localmente esa migracion.
      # Contra una base productiva va solo `classpath:db/migration`.
      - FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?falta INTERNAL_API_KEY en .env}
      # Sin claves el servicio NO arranca, y esta bien que sea asi: con clave
      # efimera cada replica firmaria distinto y el JWKS de una no validaria
      # los tokens de la otra.
      - JWT_ALLOW_EPHEMERAL=false
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?falta JWT_PRIVATE_KEY en .env}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?falta JWT_PUBLIC_KEY en .env}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ===========================================================================
  # catalog-service — :8082 — base flashdrop_catalog (Floci 7001)
  # Contexto propio: es un build de Gradle autonomo.
  # ===========================================================================
  catalog-service:
    build:
      context: ../../services/catalog-service
      dockerfile: Dockerfile
    container_name: stack-catalog
    networks: [stack, floci_default]
    environment:
      # Sin este perfil catalog arranca sin datasource: application.yaml no
      # declara ninguno, lo trae application-postgres.yaml.
      - SPRING_PROFILES_ACTIVE=postgres
      - SERVER_PORT=8082
      - DB_URL=jdbc:postgresql://172.16.1.2:7001/flashdrop_catalog
      - DB_USERNAME=catalog_app
      - DB_PASSWORD=${CATALOG_DB_PASSWORD:?falta CATALOG_DB_PASSWORD en .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?falta INTERNAL_API_KEY en .env}
      - CATALOG_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ===========================================================================
  # orders-service — :8083 — base flashdrop_orders (Floci 7002)
  # Maven, contexto propio.
  # ===========================================================================
  orders-service:
    build:
      context: ../../services/orders-service
      dockerfile: Dockerfile
    container_name: stack-orders
    networks: [stack, floci_default]
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SERVER_PORT=8083
      - DB_URL=jdbc:postgresql://172.16.1.2:7002/flashdrop_orders
      - DB_USERNAME=orders_app
      - DB_PASSWORD=${ORDERS_DB_PASSWORD:?falta ORDERS_DB_PASSWORD en .env}
      # PENDIENTE — Felipe. Su comentario GAP-06 dice que no se cambia el
      # default sin confirmar contra que instancia corre cada entorno. Esta es
      # esa instancia. Si va mal, o no se crean las tablas o el arranque falla.
      - FLYWAY_ENABLED=${ORDERS_FLYWAY_ENABLED:?PENDIENTE Felipe - ver GAP-06 en application.properties}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?falta INTERNAL_API_KEY en .env}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - DELIVERY_SERVICE_URL=http://delivery-service:8084
      # Sin broker de RabbitMQ, confirmado. Orders publica eventos pero
      # ningun servicio los consume: no hay un solo @RabbitListener en el
      # repositorio, y delivery y catalog ni siquiera declaran la dependencia
      # AMQP. Hoy los eventos no llegan a nadie.
      #
      # El publisher envuelve el envio en try/catch y solo loguea WARN, y el
      # health indicator de Rabbit esta deshabilitado, asi que la ausencia del
      # broker no impide arrancar ni marca el servicio como caido.
      #
      # Cuando alguien implemente el consumidor, hay que agregar el contenedor
      # aca y apuntarle RABBITMQ_HOST.
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ===========================================================================
  # delivery-service — :8084 — base delivery_db (Floci 7005)
  # Contexto services/: depende de shared-observability.
  # Su base usa el esquema `internal`, no `public`.
  # ===========================================================================
  delivery-service:
    build:
      context: ../../services
      dockerfile: delivery-service/Dockerfile
    container_name: stack-delivery
    networks: [stack, floci_default]
    environment:
      # `delivery` a secas, confirmado por Sebastian: sin `mock-orders`, el
      # adaptador real (HttpOrderServiceClientAdapter) se activa solo porque
      # depende de `orders.service.url`, que ya viene con valor.
      #
      # Cuidado con ORDERS_SERVICE_MOCK: esta documentada pero NO esta cableada
      # al bean. Ponerla en true no enciende el mock; lo unico que lo enciende
      # es agregar el perfil.
      - SPRING_PROFILES_ACTIVE=delivery
      - SERVER_PORT=8084
      - DELIVERY_DB_HOST=172.16.1.2
      - DELIVERY_DB_PORT=7005
      - DELIVERY_DB_NAME=delivery_db
      # `delivery_svc`, confirmado por Sebastian. Lo crea
      # infra/coolify/01-postgres-init.sql, que le da ALL PRIVILEGES sobre
      # delivery_db y hace falta porque Flyway ejecuta CREATE SCHEMA en la V1.
      #
      # OJO: ese script se escribio para Coolify y la instancia de Floci se
      # bootstrapeo con `adminfloci`, asi que este usuario probablemente
      # todavia NO existe ahi. Hay que crearlo antes de levantar; si no, el
      # arranque falla con autenticacion rechazada.
      - DELIVERY_DB_USER=${DELIVERY_DB_USER:-delivery_svc}
      - DELIVERY_DB_PASSWORD=${DELIVERY_DB_PASSWORD:?falta DELIVERY_DB_PASSWORD en .env}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?falta INTERNAL_API_KEY en .env}
      - AUTH_SERVICE_JWKS_URI=http://auth-service:8081/auth/.well-known/jwks.json
      - AUTH_SERVICE_ISSUER=flashdrop-auth
      - ORDERS_SERVICE_URL=http://orders-service:8083
      - DELIVERY_CLAIM_DELEGATE_TO_ORDERS=${DELIVERY_CLAIM_DELEGATE:-false}
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ===========================================================================
  # gateway — :3000 — unica entrada publica
  # ===========================================================================
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: stack-gateway
    networks: [stack]
    depends_on:
      redis-cache:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/app/config/gateway.yaml
      - REDIS_URL=redis://redis-cache:6379
      - LOG_LEVEL=info
    volumes:
      # En ECS esto no se traduce: Fargate no tiene volumenes del host. Hay que
      # decidir si la configuracion se hornea en la imagen o se trae de otro
      # lado — pendiente de Javier.
      - ./gateway.yaml:/app/config/gateway.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
