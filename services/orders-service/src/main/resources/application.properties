# ============================================================
# FlashDrop - Orders Service
# ============================================================

# ----------------------------
# Server
# ----------------------------
server.port=8083
spring.application.name=orders-service

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.rabbit.enabled=false

# Profile active (postgres por defecto)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

# ----------------------------
# PostgreSQL (Floci RDS / Docker) — BD PROPIA de Orders
# ----------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://172.16.1.2:7002/flashdrop_orders}
spring.datasource.username=${DB_USERNAME:orders_app}
spring.datasource.password=${DB_PASSWORD:orders_app_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# ----------------------------
# Supabase REST API (Perfil legacy / transición)
# ----------------------------
supabase.url=${SUPABASE_URL:http://localhost}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:dummy-key}

# ----------------------------
# Service-to-service (HTTP interno)
# ----------------------------
# URLs configurables de los servicios cuyos datos Orders consume por API.
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8082}
delivery.service.url=${DELIVERY_SERVICE_URL:http://localhost:8084}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Clave interna para endpoints /api/internal/* (X-Internal-Api-Key)
internal.api.key=${INTERNAL_API_KEY:dev-key}

# ----------------------------
# RabbitMQ (opcional - el servicio arranca aunque RabbitMQ no esté disponible)
# ----------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Orders Exchange and Queues
orders.rabbitmq.exchange=orders.exchange
orders.rabbitmq.routing-key.order-created=order.created
orders.rabbitmq.routing-key.order-status-updated=order.status.updated
orders.rabbitmq.queue.order-created=orders.queue.created
orders.rabbitmq.queue.order-status-updated=orders.queue.status-updated

# ----------------------------
# Business Configuration
# ----------------------------
# Delivery fee in CLP (Chilean Pesos). Default: 2500
orders.delivery-fee=${DELIVERY_FEE:2500}

# Maximum number of orders a delivery person can claim at once
orders.max-claim-per-route=3

# Distance defaults when not provided by client
orders.default-distance-km=3.2
orders.default-estimated-minutes=20

# ----------------------------
# Logging
# ----------------------------
logging.level.cl.flashdrop=DEBUG
logging.level.org.springframework.amqp=INFO
