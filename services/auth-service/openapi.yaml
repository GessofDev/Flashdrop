openapi: 3.0.3
info:
  title: FlashDrop — Auth Service API
  description: |
    Microservicio de autenticación y gestión de usuarios.

    **Responsabilidades:**
    - Registro de usuarios
    - Login y emisión de tokens JWT (RS256)
    - Refresh y logout de tokens
    - Validación de tokens (para el gateway)
    - Perfil de usuario

    **Puerto:** 8081
    **Base path:** /auth

    ## Notas para el desarrollador
    - Los IDs son **numéricos** (bigint), no UUID
    - El JWT se emite con algoritmo **RS256** (asimétrico)
    - El gateway valida los tokens usando la clave pública expuesta en `/.well-known/jwks.json`
    - El header de autenticación es `Authorization: Bearer <token>`
  version: 1.0.0
  contact:
    name: FlashDrop Backend Team

servers:
  - url: http://localhost:8081
    description: Desarrollo local

tags:
  - name: Auth
    description: Autenticación y gestión de tokens
  - name: Users
    description: Perfil de usuario
  - name: Internal
    description: Endpoints internos para comunicacion entre microservicios
  - name: Health
    description: Health checks

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check del servicio
      operationId: healthCheck
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: auth-service
                  status:
                    type: string
                    example: ok

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      description: |
        Crea un nuevo usuario con rol **Cliente** por defecto.
        Automatically crea el registro en `users`, en `login` y la asignación
        inicial en `roles`/`user_has_roles`. Ninguna tabla de otro servicio
        se toca: los demás servicios consultan a auth por HTTP.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        Autentica un usuario y devuelve un par de tokens (access + refresh).
        El access token expira en 15 minutos por defecto.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token
      description: Intercambia un refresh token válido por un nuevo par de tokens.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: Invalida el refresh token proporcionado.
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada exitosamente
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/validate:
    get:
      tags: [Auth]
      summary: Validar token JWT
      description: |
        Endpoint usado por el gateway para validar tokens.
        Retorna los claims del token si es válido.
      operationId: validateToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenClaims'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/profile:
    get:
      tags: [Users]
      summary: Obtener perfil de usuario
      description: Retorna el perfil completo del usuario autenticado.
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Token inválido o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/internal/users:
    get:
      tags: [Internal]
      summary: Obtener varios usuarios por id (batch)
      description: >-
        Variante batch para que Orders resuelva los datos de cliente de una
        lista de pedidos en una sola llamada. Devuelve siempre un array e
        ignora los ids inexistentes. No incluye roles: para eso esta
        GET /api/internal/users/{userId}/roles.
      operationId: getInternalUsers
      security:
        - internalApiKey: []
      parameters:
        - name: ids
          in: query
          required: false
          description: Ids separados por coma. Ausente o vacio devuelve [].
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
          example: [1, 2, 3]
      responses:
        '200':
          description: Lista de usuarios encontrados; puede estar vacia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalUserResponse'
        '400':
          description: Parametro ids con formato invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
        '403':
          $ref: '#/components/responses/InternalForbidden'

  /api/internal/users/{userId}:
    get:
      tags: [Internal]
      summary: Obtener datos internos de un usuario
      operationId: getInternalUser
      security:
        - internalApiKey: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUserResponse'
        '403':
          $ref: '#/components/responses/InternalForbidden'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'

  /api/internal/users/{userId}/roles:
    get:
      tags: [Internal]
      summary: Obtener roles internos de un usuario
      operationId: getInternalUserRoles
      security:
        - internalApiKey: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lista de roles; puede estar vacia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalRoleResponse'
        '403':
          $ref: '#/components/responses/InternalForbidden'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'

    put:
      tags: [Internal]
      summary: Reemplazar los roles de un usuario
      description: >-
        Contraparte de escritura del GET de roles. El cuerpo define el
        conjunto final: los roles que no aparecen dejan de estar asignados y
        una lista vacia deja al usuario sin roles. Los nombres no distinguen
        mayusculas y la respuesta devuelve siempre el nombre canonico de la
        tabla roles. El registro de un usuario nuevo nace con "Cliente";
        esta es la via para asignarle los demas. Consume el mismo caso de uso
        que usara el panel de administracion.
      operationId: assignInternalUserRoles
      security:
        - internalApiKey: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolesRequest'
            example:
              roles: [Cliente, Repartidor]
      responses:
        '200':
          description: Conjunto de roles que quedo asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignUserRolesResponse'
        '400':
          description: Rol desconocido o nombre de rol vacio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
        '403':
          $ref: '#/components/responses/InternalForbidden'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Formato: Bearer <token>"
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: Clave compartida entre microservicios configurada con INTERNAL_API_KEY

  schemas:
    InternalUserResponse:
      type: object
      additionalProperties: false
      required: [id, name, lastName, email, phone]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true

    InternalRoleResponse:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    AssignRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          description: >-
            Conjunto final de roles del usuario. Lo que no aparece deja de
            estar asignado; una lista vacia deja al usuario sin roles.
          items:
            type: string
          example: [Cliente, Repartidor]

    AssignUserRolesResponse:
      type: object
      additionalProperties: false
      required: [userId, roles]
      properties:
        userId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            $ref: '#/components/schemas/InternalRoleResponse'

    InternalErrorResponse:
      type: object
      additionalProperties: false
      required: [status, error, message]
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario (debe ser único)
          example: juan@test.com
        password:
          type: string
          minLength: 6
          description: Contraseña (mínimo 6 caracteres)
          example: mipassword123
        rut:
          type: string
          description: RUT chileno (opcional)
          example: "12.345.678-9"
        name:
          type: string
          description: Nombre del usuario
          example: Juan
        lastName:
          type: string
          description: Apellido del usuario
          example: Pérez
        phone:
          type: string
          description: Teléfono (opcional, debe ser único)
          example: "+56912345678"

    RegisterUserResult:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: ID del usuario creado
          example: 42

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Email o identificador de usuario
          example: juan@test.com
        password:
          type: string
          description: Contraseña
          example: mipassword123

    AuthResult:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          example: Juan
        email:
          type: string
          example: juan@test.com
        roles:
          type: array
          items:
            type: string
          example: ["Cliente"]
        accessToken:
          type: string
          description: JWT access token (expira en 15 min)
          example: "eyJhbGciOiJSUzI1NiIs..."
        refreshToken:
          type: string
          description: JWT refresh token (expira en 30 días)
          example: "eyJhbGciOiJSUzI1NiIs..."
        expiresInSeconds:
          type: integer
          description: Tiempo de expiración del access token en segundos
          example: 900

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: El refresh token válido
          example: "eyJhbGciOiJSUzI1NiIs..."

    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJSUzI1NiIs..."
        refreshToken:
          type: string
          example: "eyJhbGciOiJSUzI1NiIs..."
        expiresInSeconds:
          type: integer
          example: 900

    TokenClaims:
      type: object
      description: Claims decodificados del JWT
      properties:
        userId:
          type: integer
          format: int64
          example: 42
        email:
          type: string
          example: juan@test.com
        roles:
          type: array
          items:
            type: string
          example: ["Cliente"]

    UserProfile:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 42
        name:
          type: string
          example: Juan
        lastName:
          type: string
          example: Pérez
        email:
          type: string
          example: juan@test.com
        phone:
          type: string
          example: "+56912345678"
        rut:
          type: string
          example: "12.345.678-9"
        photo:
          type: string
          description: URL de la foto de perfil
          example: "https://almacenamiento.flashdrop.cl/fotos/user123.jpg"
        roles:
          type: array
          items:
            type: string
          example: ["Cliente"]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Tipo de error
          example: Bad Request
        message:
          type: string
          description: Descripción del error
          example: Email ya registrado
        timestamp:
          type: string
          format: date-time

  responses:
    InternalForbidden:
      description: Clave interna ausente o invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
    BadRequest:
      description: Solicitud inválida (validación fallida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
