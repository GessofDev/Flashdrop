spring:
  application:
    name: auth-service

# ---------------------------------------------------------------------------
# Base de datos propia de auth-service (Floci RDS).
#
# El esquema y los datos de desarrollo los crea Flyway al arrancar, leyendo
# db/migration. Hibernate solo valida que las entidades calcen con lo que las
# migraciones dejaron: nunca altera el esquema.
#
# DB_URL, DB_USERNAME y DB_PASSWORD no tienen valor por defecto a proposito:
# si falta alguna, el servicio no arranca en vez de caer silenciosamente
# contra una base equivocada.
# ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway es el unico que crea o altera el esquema. Hibernate solo valida
    # que las entidades calcen con lo que las migraciones dejaron.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # V1 crea SOLO las cinco tablas propietarias de auth. Ninguna tabla de
    # otro microservicio vive en esta base (regla de propiedad de datos).

jwt:
  issuer: flashdrop-auth
  access-expiration-minutes: ${JWT_ACCESS_MIN:15}
  refresh-expiration-days: ${JWT_REFRESH_DAYS:30}
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  allow-ephemeral-key: ${JWT_ALLOW_EPHEMERAL:false}

# S-08: límite de intentos de login por IP y por cuenta.
auth:
  ratelimit:
    max-attempts: ${AUTH_RL_MAX:5}
    window-seconds: ${AUTH_RL_WINDOW:300}

services:
  # Sin valor por defecto: si falta, /api/internal/** queda cerrado (403).
  internal-api-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

server:
  port: ${PORT:8081}
  error:
    include-message: never       # S-11: no filtrar detalles internos
    include-stacktrace: never
    include-binding-errors: never
