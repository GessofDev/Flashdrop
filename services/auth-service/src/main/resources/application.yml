spring:
  application:
    name: auth-service

# ---------------------------------------------------------------------------
# Base de datos propia de auth-service (MIGRATION_PLAN.pdf §4.1).
#
# El acceso NO es por JDBC/JPA: los adaptadores hablan PostgREST contra el
# proyecto Supabase EXCLUSIVO de auth (users, login, roles, user_has_roles,
# refresh_tokens). Por eso aquí no hay spring.datasource, spring.jpa ni
# flyway: no existe ninguna de esas dependencias en build.gradle.kts y la
# configuración solo confundía sobre cuál es la conexión real.
#
# La conexión se define en application-supabase.yml y se activa con
# SPRING_PROFILES_ACTIVE=supabase. El esquema y el seed se aplican a mano
# desde db/01_schema.sql y db/02_seed.sql.
# ---------------------------------------------------------------------------

# Firma asimétrica RS256. En producción se proveen las claves RSA por entorno
# (JWT_PRIVATE_KEY / JWT_PUBLIC_KEY en PEM). Si faltan y allow-ephemeral es false,
# el arranque FALLA (S-02). El gateway valida con la clave pública del JWKS.
jwt:
  issuer: flashdrop-auth
  access-expiration-minutes: ${JWT_ACCESS_MIN:15}
  refresh-expiration-days: ${JWT_REFRESH_DAYS:30}
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  allow-ephemeral-key: ${JWT_ALLOW_EPHEMERAL:false}

# S-08: límite de intentos de login por IP y por cuenta.
auth:
  ratelimit:
    max-attempts: ${AUTH_RL_MAX:5}
    window-seconds: ${AUTH_RL_WINDOW:300}

services:
  # Sin valor por defecto: si falta, /api/internal/** queda cerrado (403).
  internal-api-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

server:
  port: ${PORT:8081}
  error:
    include-message: never       # S-11: no filtrar detalles internos
    include-stacktrace: never
    include-binding-errors: never
