# ============================================================
# FlashDrop - Orders Service (Perfil supabase)
# ============================================================
# Este perfil excluye las auto-configuraciones JDBC/JPA/Flyway
# ya que el servicio se conecta a Supabase vía REST API.

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# URL del auth-service para validación JWT
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}