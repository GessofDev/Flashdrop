# ============================================================
# FlashDrop - Orders Service (Test Profile)
# ============================================================

# WireMock URLs - overridden dynamically by @DynamicPropertySource in tests
auth.service.url=http://localhost:${wiremock.auth.port:0}
catalog.service.url=http://localhost:${wiremock.catalog.port:0}
delivery.service.url=http://localhost:${wiremock.delivery.port:0}

# Internal API Key for test
internal.api.key=test-internal-key

# Supabase (not used in adapter tests, but required for context loading)
supabase.url=http://localhost:0
supabase.service-role-key=test-role-key

# RabbitMQ (not started in adapter tests)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Server port (random for parallel tests)
server.port=0

# Disable security for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
